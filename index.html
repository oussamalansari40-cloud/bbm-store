<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBM STORE — المتجر</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0F0B07;
  --card:#1C140B;
  --card2:#241A0F;
  --gold:#E8B34D;
  --gold2:#D9A339;
  --text:#F3E7CE;
  --muted:#B8A888;
  --line:#3A2D1A;
  --danger:#ff7777;
  --green:#69d391;
  --radius:18px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:430px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  position:relative;
  padding-bottom:80px;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(15,11,7,.95);
  backdrop-filter:blur(15px);
  padding:16px 18px;
  border-bottom:1px solid var(--line);
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:42px;
  height:42px;
  border-radius:13px;
  overflow:hidden;
  background:var(--card2);
}

.logo-icon img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo-name{
  font-size:19px;
  font-weight:900;
  color:var(--gold);
}

.cart-button{
  width:44px;
  height:44px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  font-size:21px;
  position:relative;
}

.cart-count{
  position:absolute;
  top:-5px;
  left:-5px;
  min-width:20px;
  height:20px;
  border-radius:50%;
  background:var(--gold);
  color:#241708;
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* SEARCH */

.search-area{
  padding:18px;
}

.search{
  width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px 16px;
  color:var(--text);
  outline:none;
  font-size:14px;
}

.search:focus{
  border-color:var(--gold);
}

.search::placeholder{
  color:#81745d;
}

/* CATEGORY */

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding:0 18px 16px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  white-space:nowrap;
  padding:9px 15px;
  border-radius:30px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
  font-weight:800;
}

.category.active{
  background:var(--gold);
  color:#211504;
  border-color:var(--gold);
}

/* BANNER */

.banner{
  margin:0 18px 20px;
  min-height:155px;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(90deg,rgba(15,11,7,.92),rgba(15,11,7,.25)),
    url('bbm-banner-ad.jpg') center/cover;
  display:flex;
  align-items:center;
  padding:20px;
}

.banner-content{
  max-width:75%;
}

.banner h1{
  font-size:21px;
  font-weight:900;
  margin-bottom:8px;
}

.banner p{
  font-size:12px;
  color:#e0d4bc;
  line-height:1.7;
}

/* SECTION */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px 14px;
}

.section-title h2{
  font-size:17px;
  font-weight:900;
}

.section-title span{
  color:var(--gold);
  font-size:12px;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:0 18px;
}

.product{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  overflow:hidden;
  position:relative;
}

.product-image{
  height:145px;
  background:var(--card2);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.product-placeholder{
  font-size:48px;
}

.product-info{
  padding:12px;
}

.product-name{
  font-size:14px;
  font-weight:800;
  margin-bottom:5px;
  line-height:1.5;
}

.product-desc{
  font-size:10px;
  color:var(--muted);
  height:30px;
  overflow:hidden;
  line-height:1.5;
}

.price{
  margin-top:9px;
  font-size:15px;
  color:var(--gold);
  font-weight:900;
}

.old-price{
  color:#7d725f;
  text-decoration:line-through;
  font-size:10px;
  margin-right:5px;
}

.add-button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:0;
  border-radius:11px;
  background:var(--gold);
  color:#211504;
  font-weight:900;
  font-size:12px;
}

.add-button:active{
  transform:scale(.97);
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:var(--muted);
  font-size:13px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(430px,100%);
  height:68px;
  background:rgba(28,20,11,.97);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:50;
}

.nav{
  border:0;
  background:none;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.nav-icon{
  font-size:20px;
}

.nav.active{
  color:var(--gold);
}

/* DRAWER */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:100;
  display:none;
}

.overlay.show{
  display:block;
}

.drawer{
  position:absolute;
  right:0;
  top:0;
  width:min(430px,100%);
  height:100%;
  background:var(--bg);
  overflow-y:auto;
  padding-bottom:30px;
}

.drawer-header{
  padding:18px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  width:38px;
  height:38px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:white;
  font-size:18px;
}

/* CART */

.cart-items{
  padding:18px;
}

.cart-item{
  display:flex;
  gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:10px;
  margin-bottom:10px;
}

.cart-img{
  width:70px;
  height:70px;
  border-radius:12px;
  overflow:hidden;
  background:var(--card2);
  flex-shrink:0;
}

.cart-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.cart-details{
  flex:1;
}

.cart-name{
  font-size:13px;
  font-weight:800;
}

.cart-price{
  color:var(--gold);
  font-weight:900;
  font-size:13px;
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}

.qty button{
  width:27px;
  height:27px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card2);
  color:white;
}

.remove{
  color:var(--danger);
  background:none;
  border:0;
  font-size:11px;
  margin-top:5px;
}

/* CART TOTAL */

.cart-total{
  margin:18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:17px;
  padding:17px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
  font-size:13px;
}

.total-final{
  border-top:1px solid var(--line);
  padding-top:12px;
  font-size:17px;
  font-weight:900;
  color:var(--gold);
}

.checkout{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:var(--gold);
  color:#211504;
  font-weight:900;
  margin-top:12px;
}

/* CHECKOUT */

.checkout-form{
  padding:18px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--text);
  outline:none;
}

.field textarea{
  min-height:90px;
  resize:none;
}

.submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:var(--gold);
  color:#211504;
  font-weight:900;
}

.message{
  display:none;
  padding:12px;
  border-radius:11px;
  margin-bottom:12px;
  text-align:center;
  font-size:12px;
}

.message.success{
  display:block;
  background:rgba(105,211,145,.12);
  color:var(--green);
}

.message.error{
  display:block;
  background:rgba(255,119,119,.12);
  color:var(--danger);
}

/* ORDERS */

.orders{
  padding:18px;
}

.order{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin-bottom:12px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
}

.order-number{
  font-size:13px;
  font-weight:900;
}

.status{
  padding:5px 9px;
  border-radius:20px;
  background:var(--gold);
  color:#211504;
  font-size:10px;
  font-weight:900;
}

.order-info{
  color:var(--muted);
  font-size:11px;
  line-height:1.8;
}

/* PROFILE */

.profile{
  padding:18px;
}

.profile-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  text-align:center;
}

.avatar{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:var(--card2);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  margin-bottom:10px;
}

.profile-name{
  font-weight:900;
}

.profile-email{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:82px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--card);
  border:1px solid var(--gold);
  color:var(--text);
  padding:12px 17px;
  border-radius:12px;
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:200;
  width:max-content;
  max-width:90%;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* DESKTOP */

@media(min-width:700px){
  body{
    background:#080604;
  }

  .app{
    box-shadow:0 0 50px rgba(0,0,0,.5);
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HEADER -->
<header class="header">
  <div class="header-row">

    <div class="logo">
      <div class="logo-icon">
        <img src="bbm-icon.png" alt="BBM">
      </div>

      <div class="logo-name">
        BBM STORE
      </div>
    </div>

    <button class="cart-button" onclick="openCart()">
      🛒
      <span class="cart-count" id="cartCount">0</span>
    </button>

  </div>
</header>


<!-- HOME -->
<main id="homePage">

  <div class="search-area">
    <input
      class="search"
      id="searchInput"
      type="search"
      placeholder="🔎 ابحث عن منتج..."
      oninput="renderProducts()"
    >
  </div>


  <!-- CATEGORIES -->
  <div class="categories" id="categories"></div>


  <!-- BANNER -->
  <div class="banner">
    <div class="banner-content">
      <h1>🛍️ السوق المحلي</h1>
      <p>
        اكتشف المنتجات والخدمات المحلية
        واطلبها بسهولة من BBM STORE.
      </p>
    </div>
  </div>


  <div class="section-title">
    <h2>المنتجات</h2>
    <span id="productCount"></span>
  </div>


  <div class="products" id="products"></div>

</main>


<!-- ORDERS -->
<section id="ordersPage" style="display:none">

  <div class="drawer-header">
    <h2>طلباتي</h2>
  </div>

  <div class="orders" id="ordersList"></div>

</section>


<!-- PROFILE -->
<section id="profilePage" style="display:none">

  <div class="drawer-header">
    <h2>حسابي</h2>
  </div>

  <div class="profile">

    <div class="profile-card">

      <div class="avatar">
        👤
      </div>

      <div class="profile-name" id="profileName">
        زائر BBM
      </div>

      <div class="profile-email">
        يمكنك تسجيل الدخول لاحقًا لربط حسابك.
      </div>

    </div>

  </div>

</section>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="nav active" onclick="showPage('home')">
    <span class="nav-icon">🏠</span>
    الرئيسية
  </button>

  <button class="nav" onclick="openCart()">
    <span class="nav-icon">🛒</span>
    السلة
  </button>

  <button class="nav" onclick="showPage('orders')">
    <span class="nav-icon">📋</span>
    طلباتي
  </button>

  <button class="nav" onclick="showPage('profile')">
    <span class="nav-icon">👤</span>
    حسابي
  </button>

</nav>

</div>


<!-- CART OVERLAY -->
<div class="overlay" id="cartOverlay">

  <div class="drawer">

    <div class="drawer-header">

      <h2>🛒 سلة المشتريات</h2>

      <button class="close" onclick="closeCart()">✕</button>

    </div>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-total">

      <div class="total-row">
        <span>عدد المنتجات</span>
        <span id="cartItemsCount">0</span>
      </div>

      <div class="total-row">
        <span>المجموع</span>
        <span id="cartSubtotal">0 دج</span>
      </div>

      <div class="total-row">
        <span>التوصيل</span>
        <span id="deliveryPrice">حسب المنطقة</span>
      </div>

      <div class="total-row total-final">
        <span>الإجمالي</span>
        <span id="cartTotal">0 دج</span>
      </div>

      <button class="checkout" onclick="openCheckout()">
        متابعة الطلب
      </button>

    </div>

  </div>

</div>


<!-- CHECKOUT -->
<div class="overlay" id="checkoutOverlay">

  <div class="drawer">

    <div class="drawer-header">

      <h2>📦 إتمام الطلب</h2>

      <button class="close" onclick="closeCheckout()">✕</button>

    </div>

    <div class="checkout-form">

      <div id="checkoutMessage" class="message"></div>

      <div class="field">

        <label>الاسم الكامل</label>

        <input
          id="customerName"
          type="text"
          placeholder="مثال: محمد نصاري"
        >

      </div>


      <div class="field">

        <label>رقم الهاتف</label>

        <input
          id="customerPhone"
          type="tel"
          placeholder="0555 12 34 56"
        >

      </div>


      <div class="field">

        <label>الولاية / المنطقة</label>

        <input
          id="customerArea"
          type="text"
          placeholder="برج باجي مختار"
        >

      </div>


      <div class="field">

        <label>العنوان بالتفصيل</label>

        <textarea
          id="customerAddress"
          placeholder="الحي، الشارع، رقم المنزل..."
        ></textarea>

      </div>


      <div class="field">

        <label>طريقة الدفع</label>

        <select id="paymentMethod">

          <option value="cash">
            الدفع عند الاستلام
          </option>

          <option value="baridimob">
            BaridiMob
          </option>

          <option value="ccp">
            CCP
          </option>

          <option value="flexy">
            Flexy
          </option>

        </select>

      </div>


      <button
        class="submit"
        onclick="submitOrder()"
        id="submitOrderButton"
      >
        تأكيد الطلب
      </button>

    </div>

  </div>

</div>


<!-- TOAST -->
<div class="toast" id="toast"></div>


<script>

/* =========================================================
   BBM STORE
   LOCAL STORE VERSION
========================================================= */


/* PRODUCTS */

const PRODUCTS = [

  {
    id:1,
    name:"هاتف ذكي اقتصادي",
    category:"هواتف",
    price:28000,
    oldPrice:32000,
    emoji:"📱",
    image:"",
    description:"هاتف مناسب للاستخدام اليومي."
  },

  {
    id:2,
    name:"سماعات لاسلكية",
    category:"إلكترونيات",
    price:3500,
    oldPrice:4500,
    emoji:"🎧",
    image:"",
    description:"سماعات لاسلكية بجودة جيدة."
  },

  {
    id:3,
    name:"شاحن سريع",
    category:"إلكترونيات",
    price:1800,
    oldPrice:2200,
    emoji:"🔌",
    image:"",
    description:"شاحن سريع للهواتف."
  },

  {
    id:4,
    name:"قميص رجالي",
    category:"ملابس",
    price:2800,
    oldPrice:3500,
    emoji:"👕",
    image:"",
    description:"قميص رجالي أنيق."
  },

  {
    id:5,
    name:"حذاء رياضي",
    category:"ملابس",
    price:6500,
    oldPrice:7500,
    emoji:"👟",
    image:"",
    description:"حذاء مناسب للرياضة والاستخدام اليومي."
  },

  {
    id:6,
    name:"عطر رجالي",
    category:"عطور",
    price:4500,
    oldPrice:5500,
    emoji:"🧴",
    image:"",
    description:"عطر برائحة مميزة."
  },

  {
    id:7,
    name:"ساعة يد",
    category:"إكسسوارات",
    price:5500,
    oldPrice:7000,
    emoji:"⌚",
    image:"",
    description:"ساعة أنيقة للاستخدام اليومي."
  },

  {
    id:8,
    name:"حقيبة ظهر",
    category:"إكسسوارات",
    price:3200,
    oldPrice:4000,
    emoji:"🎒",
    image:"",
    description:"حقيبة عملية للدراسة والعمل."
  },

  {
    id:9,
    name:"مواد غذائية",
    category:"غذائيات",
    price:1200,
    oldPrice:1400,
    emoji:"🛒",
    image:"",
    description:"منتجات غذائية محلية."
  },

  {
    id:10,
    name:"ماء معدني",
    category:"غذائيات",
    price:100,
    oldPrice:120,
    emoji:"💧",
    image:"",
    description:"مياه معدنية."
  }

];


/* STATE */

let selectedCategory = "الكل";

let cart = JSON.parse(
  localStorage.getItem("bbm_cart") || "[]"
);

let orders = JSON.parse(
  localStorage.getItem("bbm_orders") || "[]"
);


/* CATEGORIES */

function renderCategories(){

  const categories =
    ["الكل", ...new Set(PRODUCTS.map(p=>p.category))];

  const container =
    document.getElementById("categories");

  container.innerHTML =
    categories.map(category => `

      <button
        class="category ${category === selectedCategory ? "active":""}"
        onclick="selectCategory('${escapeHtml(category)}')"
      >
        ${escapeHtml(category)}
      </button>

    `).join("");

}


function selectCategory(category){

  selectedCategory = category;

  renderCategories();

  renderProducts();

}


/* PRODUCTS */

function renderProducts(){

  const query =
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  let products = PRODUCTS.filter(product => {

    const matchesCategory =
      selectedCategory === "الكل" ||
      product.category === selectedCategory;

    const matchesSearch =
      !query ||
      product.name.toLowerCase().includes(query) ||
      product.category.toLowerCase().includes(query) ||
      product.description.toLowerCase().includes(query);

    return matchesCategory && matchesSearch;

  });


  const container =
    document.getElementById("products");

  document.getElementById("productCount")
    .textContent = `${products.length} منتج`;


  if(products.length === 0){

    container.innerHTML = `
      <div class="empty" style="grid-column:1/-1">
        🔎<br><br>
        لم نجد منتجات مطابقة للبحث.
      </div>
    `;

    return;
  }


  container.innerHTML =
    products.map(product => `

      <article class="product">

        <div class="product-image">

          ${
            product.image
            ?
            `<img src="${product.image}" alt="${escapeHtml(product.name)}">`
            :
            `<div class="product-placeholder">${product.emoji}</div>`
          }

        </div>

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="product-desc">
            ${escapeHtml(product.description)}
          </div>

          <div class="price">

            ${formatPrice(product.price)} دج

            ${
              product.oldPrice
              ?
              `<span class="old-price">
                ${formatPrice(product.oldPrice)}
              </span>`
              :
              ""
            }

          </div>

          <button
            class="add-button"
            onclick="addToCart(${product.id})"
          >
            🛒 أضف إلى السلة
          </button>

        </div>

      </article>

    `).join("");

}


/* CART */

function addToCart(productId){

  const product =
    PRODUCTS.find(p => p.id === productId);

  if(!product) return;


  const existing =
    cart.find(item => item.id === productId);


  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      id:product.id,
      quantity:1
    });

  }


  saveCart();

  updateCartUI();

  showToast("تمت إضافة المنتج إلى السلة 🛒");

}


function decreaseQuantity(productId){

  const item =
    cart.find(item => item.id === productId);

  if(!item) return;

  item.quantity--;

  if(item.quantity <= 0){

    cart =
      cart.filter(item => item.id !== productId);

  }

  saveCart();

  updateCartUI();

}


function increaseQuantity(productId){

  const item =
    cart.find(item => item.id === productId);

  if(!item) return;

  item.quantity++;

  saveCart();

  updateCartUI();

}


function removeFromCart(productId){

  cart =
    cart.filter(item => item.id !== productId);

  saveCart();

  updateCartUI();

}


function getCartProducts(){

  return cart.map(item => {

    const product =
      PRODUCTS.find(p => p.id === item.id);

    return {
      ...product,
      quantity:item.quantity
    };

  }).filter(Boolean);

}


function getCartCount(){

  return cart.reduce(
    (total,item)=>total + item.quantity,
    0
  );

}


function getSubtotal(){

  return getCartProducts().reduce(
    (total,item)=>total + item.price * item.quantity,
    0
  );

}


function updateCartUI(){

  const count =
    getCartCount();

  document.getElementById("cartCount")
    .textContent = count;


  document.getElementById("cartItemsCount")
    .textContent = count;


  const subtotal =
    getSubtotal();

  document.getElementById("cartSubtotal")
    .textContent =
    formatPrice(subtotal) + " دج";


  document.getElementById("cartTotal")
    .textContent =
    formatPrice(subtotal) + " دج";


  const container =
    document.getElementById("cartItems");


  const products =
    getCartProducts();


  if(products.length === 0){

    container.innerHTML = `
      <div class="empty">
        🛒<br><br>
        السلة فارغة
      </div>
    `;

    return;

  }


  container.innerHTML =
    products.map(item => `

      <div class="cart-item">

        <div class="cart-img">

          ${
            item.image
            ?
            `<img src="${item.image}">`
            :
            `<div style="
              height:100%;
              display:flex;
              align-items:center;
              justify-content:center;
              font-size:32px;
            ">${item.emoji}</div>`
          }

        </div>


        <div class="cart-details">

          <div class="cart-name">
            ${escapeHtml(item.name)}
          </div>

          <div class="cart-price">
            ${formatPrice(item.price * item.quantity)} دج
          </div>


          <div class="qty">

            <button onclick="decreaseQuantity(${item.id})">
              −
            </button>

            <strong>
              ${item.quantity}
            </strong>

            <button onclick="increaseQuantity(${item.id})">
              +
            </button>

          </div>


          <button
            class="remove"
            onclick="removeFromCart(${item.id})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");

}


function saveCart(){

  localStorage.setItem(
    "bbm_cart",
    JSON.stringify(cart)
  );

}


/* CART DRAWER */

function openCart(){

  document
    .getElementById("cartOverlay")
    .classList.add("show");

  updateCartUI();

}


function closeCart(){

  document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


/* CHECKOUT */

function openCheckout(){

  if(cart.length === 0){

    showToast("السلة فارغة");

    return;

  }

  closeCart();

  document
    .getElementById("checkoutOverlay")
    .classList.add("show");

}


function closeCheckout(){

  document
    .getElementById("checkoutOverlay")
    .classList.remove("show");

}


/* SUBMIT ORDER */

function submitOrder(){

  const name =
    document.getElementById("customerName")
    .value.trim();

  const phone =
    document.getElementById("customerPhone")
    .value.trim();

  const area =
    document.getElementById("customerArea")
    .value.trim();

  const address =
    document.getElementById("customerAddress")
    .value.trim();

  const payment =
    document.getElementById("paymentMethod")
    .value;


  const message =
    document.getElementById("checkoutMessage");


  if(!name || !phone || !area || !address){

    message.className =
      "message error";

    message.textContent =
      "الرجاء تعبئة جميع المعلومات المطلوبة.";

    return;

  }


  const products =
    getCartProducts();


  const subtotal =
    getSubtotal();


  const order = {

    id:
      "BBM-" +
      Date.now().toString().slice(-8),

    customer:{
      name,
      phone,
      area,
      address
    },

    payment,

    products,

    subtotal,

    total:subtotal,

    status:"جديد",

    createdAt:
      new Date().toISOString()

  };


  orders.unshift(order);


  localStorage.setItem(
    "bbm_orders",
    JSON.stringify(orders)
  );


  cart = [];

  saveCart();

  updateCartUI();

  renderOrders();


  message.className =
    "message success";

  message.textContent =
    `تم إنشاء طلبك بنجاح 🎉 رقم الطلب ${order.id}`;


  setTimeout(()=>{

    closeCheckout();

    showPage("orders");

    showToast("تم إرسال الطلب بنجاح 🎉");

  },1000);

}


/* ORDERS */

function renderOrders(){

  const container =
    document.getElementById("ordersList");


  if(orders.length === 0){

    container.innerHTML = `
      <div class="empty">
        📋<br><br>
        لا توجد طلبات بعد.
      </div>
    `;

    return;

  }


  container.innerHTML =
    orders.map(order => `

      <div class="order">

        <div class="order-top">

          <div class="order-number">
            ${escapeHtml(order.id)}
          </div>

          <div class="status">
            ${escapeHtml(order.status)}
          </div>

        </div>


        <div class="order-info">

          👤 ${escapeHtml(order.customer.name)}
          <br>

          📞 ${escapeHtml(order.customer.phone)}
          <br>

          📍 ${escapeHtml(order.customer.area)}
          <br>

          💳 ${getPaymentName(order.payment)}
          <br>

          🛍️ ${order.products.length} منتج
          <br>

          💰
          <strong style="color:var(--gold)">
            ${formatPrice(order.total)} دج
          </strong>

        </div>

      </div>

    `).join("");

}


/* PAGES */

function showPage(page){

  document
    .getElementById("homePage")
    .style.display =
    page === "home"
    ? "block"
    : "none";


  document
    .getElementById("ordersPage")
    .style.display =
    page === "orders"
    ? "block"
    : "none";


  document
    .getElementById("profilePage")
    .style.display =
    page === "profile"
    ? "block"
    : "none";


  document
    .querySelectorAll(".nav")
    .forEach(nav => nav.classList.remove("active"));


  if(page === "home")
    document.querySelectorAll(".nav")[0].classList.add("active");

  if(page === "orders")
    document.querySelectorAll(".nav")[2].classList.add("active");

  if(page === "profile")
    document.querySelectorAll(".nav")[3].classList.add("active");


  window.scrollTo(0,0);

}


/* HELPERS */

function formatPrice(number){

  return Number(number).toLocaleString("ar-DZ");

}


function getPaymentName(payment){

  const names = {

    cash:"الدفع عند الاستلام",

    baridimob:"BaridiMob",

    ccp:"CCP",

    flexy:"Flexy"

  };

  return names[payment] || payment;

}


function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showToast(text){

  const toast =
    document.getElementById("toast");

  toast.textContent = text;

  toast.classList.add("show");


  setTimeout(()=>{

    toast.classList.remove("show");

  },2200);

}


/* INIT */

renderCategories();

renderProducts();

updateCartUI();

renderOrders();

</script>
